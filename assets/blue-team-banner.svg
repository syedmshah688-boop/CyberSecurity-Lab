<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Blue Team Security Operations</title>
<desc id="desc">Animated navy and cyan security operations banner with a live signal sweep.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#0b2850"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity=".08" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="300" rx="24" fill="url(#bg)"/>
<rect width="1200" height="300" rx="24" fill="url(#grid)"/>
<path d="M0 245H1200" stroke="#38bdf8" stroke-opacity=".16"/>
<text x="72" y="76" fill="#67e8f9" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">SECURITY OPERATIONS · DEFENSIVE SECURITY</text>
<text x="68" y="158" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="2">BLUE TEAM</text>
<text x="72" y="202" fill="#bfdbfe" font-family="Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="2">DETECT  ·  INVESTIGATE  ·  RESPOND</text>
<g transform="translate(1000 142)" fill="none" stroke="#67e8f9" stroke-width="3">
  <path d="M0 -76L62 -53V-7C62 32 34 61 0 79C-34 61-62 32-62-7V-53Z" stroke-opacity=".88"/>
  <path d="M-27 2L-8 21L31-21" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</g>
<circle cx="1100" cy="70" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="1118" y="76" fill="#a7f3d0" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1">MONITORING</text>
<rect x="-260" y="241" width="260" height="3" fill="url(#line)" filter="url(#glow)">
  <animate attributeName="x" from="-260" to="1200" dur="4.5s" repeatCount="indefinite"/>
</rect>
<circle cx="70" cy="267" r="4" fill="#22d3ee" filter="url(#glow)"/>
<text x="86" y="272" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">SOC ALERT TRIAGE LAB · PORTFOLIO</text>
</svg>